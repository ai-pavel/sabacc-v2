<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Sabacc of Coruscant</title>
<link href="src/style.css" rel="stylesheet">
<!-- i18n: loader + locales + init must load before game.js -->
<script src="src/i18n/loader.js"></script>
<script src="src/i18n/en.js"></script>
<script src="src/i18n/ru.js"></script>
<script src="src/i18n/es.js"></script>
<script src="src/i18n/fr.js"></script>
<script src="src/i18n/de.js"></script>
<script src="src/i18n/pl.js"></script>
<script src="src/i18n/it.js"></script>
<script src="src/i18n/pt.js"></script>
<script src="src/i18n/ja.js"></script>
<script src="src/i18n/zh.js"></script>
<script src="src/i18n/init.js"></script>
<!-- Game logic -->
<script src="src/game.js"></script>
</head>
<body>

<!-- ============ Start screen (name entry) ============ -->
<div id="startPanel" class="screen">
  <div class="screen-inner">
    <p class="title" data-i18n="ui.copyright">Sabacc of Coruscant &copy; 2005</p>
    <div class="form-row">
      <span class="label" data-i18n="ui.yourName">Your name:</span>
      <input type="text" class="formControl" id="nameInput" maxlength="19" placeholder="Player" data-i18n-ph="defaultPlayerName">
    </div>
    <div class="form-row">
      <input name="music" type="checkbox" class="formControl" id="musicToggle" checked>
      <span class="label" data-i18n="ui.enableMusic">Enable music?</span>
    </div>
    <div class="form-row">
      <span class="label" data-i18n="ui.language">Language:</span>
      <select id="langSelect" class="formControl"></select>
    </div>
    <div class="form-row">
      <input type="button" class="formControl" onClick="gamer()" value="Start game" data-i18n="ui.startGame">
      <a href="credits.html" data-i18n="ui.credits">Credits</a>
    </div>
  </div>
</div>

<!-- ============ Game screen ============ -->
<div id="game" class="screen game-screen">

  <!-- Top row: generator panel | interference field | event log + buttons -->
  <div class="game-top">

    <!-- Generator (randomizer pot) display -->
    <div class="generator-panel">
      <input type="text" class="formControl gen-card" id="genCard1" readonly>
      <img src="assets/ui/generator.gif" alt="generator" data-i18n="uiGame.generatorAlt">
      <input type="text" class="formControl gen-card" id="genCard2" readonly>
    </div>

    <!-- Interference field: cpu1 | player | cpu2 -->
    <div class="field-panel">
      <div class="field-label" data-i18n="uiGame.interferenceField">Interference field</div>
      <div class="field-slots">
        <img src="assets/cards/field.gif" alt="Opponent's interference field" id="cpu1Field" data-i18n="alt.opponentField">
        <div id="playerFieldDrop" class="field-drop-zone">
          <img src="assets/cards/field.gif" alt="Your interference field" id="playerField" data-i18n="alt.yourField">
        </div>
        <img src="assets/cards/field.gif" alt="Opponent's interference field" id="cpu2Field" data-i18n="alt.opponentField">
      </div>
      <p class="field-hint" data-i18n="uiGame.fieldHint">Drag a card here to protect it</p>
    </div>

    <!-- Event log + action buttons -->
    <div class="log-panel">
      <textarea readonly wrap="virtual" class="eventLogStyle" id="eventLog"></textarea>
      <div class="action-buttons">
        <input type="button" class="formControl" id="turnBtn" onClick="turn()" value="Next turn" data-i18n="uiGame.nextTurn">
        <input type="button" class="formControl" id="passBtn" onClick="pass()" value="Pass" data-i18n="uiGame.pass">
      </div>
    </div>

  </div>

  <!-- Card table: cpu1 | player | cpu2 -->
  <div class="card-table">

    <div class="hand cpu1-hand">
      <div class="hand-drawn">
        <img src="assets/cards/blank.gif" id="cpu1Card2">
        <img src="assets/cards/blank.gif" id="cpu1Card3">
        <img src="assets/cards/blank.gif" id="cpu1Card4">
      </div>
      <div class="hand-dealt">
        <img src="assets/cards/wallp.gif" id="cpu1Card0">
        <img src="assets/cards/wallp.gif" id="cpu1Card1">
      </div>
    </div>

    <div class="hand player-hand">
      <div class="hand-drawn">
        <img src="assets/cards/blank.gif" id="playerCard2">
        <img src="assets/cards/blank.gif" id="playerCard3">
        <img src="assets/cards/blank.gif" id="playerCard4">
      </div>
      <div class="hand-dealt">
        <img src="assets/cards/blank.gif" id="playerCard0">
        <img src="assets/cards/blank.gif" id="playerCard1">
      </div>
    </div>

    <div class="hand cpu2-hand">
      <div class="hand-drawn">
        <img src="assets/cards/blank.gif" id="cpu2Card2">
        <img src="assets/cards/blank.gif" id="cpu2Card3">
        <img src="assets/cards/blank.gif" id="cpu2Card4">
      </div>
      <div class="hand-dealt">
        <img src="assets/cards/wallp.gif" id="cpu2Card0">
        <img src="assets/cards/wallp.gif" id="cpu2Card1">
      </div>
    </div>

  </div>

  <!-- Avatar row: cpu1 | player | cpu2 -->
  <div class="avatar-row">
    <img src="assets/avatars/blank.gif" id="cpu1Avatar" alt="CPU 1" data-i18n="uiGame.cpu1Alt">
    <img src="assets/avatars/default.gif" id="playerAvatar" alt="You" data-i18n="uiGame.youAlt">
    <img src="assets/avatars/blank.gif" id="cpu2Avatar" alt="CPU 2" data-i18n="uiGame.cpu2Alt">
  </div>

</div>

<!-- Toast notification container -->
<div id="toastContainer"></div>

<audio id="musicPlayer" loop autoplay hidden></audio>
</body>
</html>
